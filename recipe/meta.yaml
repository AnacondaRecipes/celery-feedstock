{% set name = "celery" %}
{% set version = "5.7.0" %}
{% set u_test_files_to_skip = " " %}
{% set u_test_files_to_skip = u_test_files_to_skip + "--ignore=t/unit/app/test_preload_cli.py " %}
{% set u_test_files_to_skip = u_test_files_to_skip + "--ignore=t/unit/bin/test_beat.py " %}
{% set u_test_files_to_skip = u_test_files_to_skip + "--ignore=t/unit/bin/test_control.py " %}
{% set u_test_files_to_skip = u_test_files_to_skip + "--ignore=t/unit/bin/test_worker.py " %}
{% set u_test_files_to_skip = u_test_files_to_skip + "--ignore=t/unit/bin/test_daemonization.py " %}
{% set u_test_files_to_skip = u_test_files_to_skip + "--ignore=t/unit/backends/test_redis.py " %}
{% set u_tests_to_skip = " test_check_privileges " %}
{% set u_tests_to_skip = u_tests_to_skip + "or test_pytest_celery_marker_registration " %}
{% set u_tests_to_skip = u_tests_to_skip + "or test_on_event_task_received " %}
{% set u_tests_to_skip = u_tests_to_skip + "or test_on_event_non_task " %}

# E       fixture 'cli_runner' not found : for next tests:
# TypeError: NoneType takes no arguments
# celery.exceptions.SecurityError: Running a worker with superuser privileges
# Failed: DID NOT RAISE any of (<class 'ValueError'>, <class 'Failed'>)
# AssertionError: assert 'worker1 [2024-01-01 12:00:00]' in 'worker1 [2024-01-01 10:00:00] task received mytask(abc) args=(1,) kwargs={} \n'
# AssertionError: assert 'worker1 [2024-01-01 12:00:00]' in 'worker1 [2024-01-01 10:00:00] started: foo=bar\n'
package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 6a5dfcf6662287204f009a02002b9e66c83d4105e47ebabdc7079108772fc6f0

build:
  number: 0
  entry_points:
    - celery = celery.__main__:main
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<39]

requirements:
  host:
    - python
    - pip
    - wheel >=0.33.1
    - setuptools >=40.8.0
  run:
    - python
    - billiard >=4.3.2
    - kombu >=5.7.0
    - vine >=5.1.0,<6.0
    - click >=8.3.1,<9.0
    - click-didyoumean >=0.3.1
    - click-repl >=0.4.1
    - click-plugins >=1.1.1.2
    - python-dateutil ==2.9.0.post0
    - exceptiongroup >=1.3.0  # [py<311]
    - tzlocal
  run_constrained:
    - pyArango >=2.1.1
    - cryptography ==50.0.2
    - azure-storage-blob ==12.31.1
    - azure-identity ==1.27.0
    - cassandra-driver ==3.30.1
    - python-consul2 ==0.1.5
    - pydocumentdb ==2.3.5
    - pycouchdb ==1.17.1
    - Django >=3.2.1
    - boto3 >=1.26.143
    - elasticsearch <=9.5.1
    - elastic-transport <=9.4.2
    - kombu >=5.5.0
    - google-cloud-storage ==3.17.1
    - grpcio ==1.85.1
    - google-cloud-firestore ==2.32.0
    - gevent ==26.9.0
    - pymemcache >=4.0.0
    - pydantic ==2.14.1
    - softlayer_messaging >=1.0.3
    - urllib3 >=1.26.16
    - tblib ==3.2.2
    - kazoo >=1.3.1
    - zstandard ==0.23.0

test:
  requires:
    - pytest >=8.4.2
    - pytest-subtests
    - pytest-rerunfailures >=15.0
    - msgpack-python
    - dnspython
    - google-cloud-storage >=2.10.0
    - azure-storage-blob >=12.15.0
    - sqlalchemy
    - pymongo
    - boto3 >=1.26.143
    - moto >=4.1.11,<5.1.0  # [py<=313]
    - moto  # [py==314]
    - pydantic
    - pip
  source_files:
    - t
  imports:
    - celery
    - celery.app
    - celery.apps
    - celery.backends
    - celery.backends.database
    - celery.bin
    - celery.concurrency
    - celery.contrib
    - celery.events
    - celery.fixups
    - celery.loaders
    - celery.security
    - celery.utils
    - celery.utils.dispatch
    - celery.utils.static
    - celery.worker
    - celery.worker.consumer
  commands:
    - celery --version
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -v t/unit {{ u_test_files_to_skip }} -k "not ({{ u_tests_to_skip }})"

about:
  home: https://docs.celeryq.dev
  license_file: LICENSE
  license: BSD-3-Clause
  license_family: BSD
  summary: Distributed Task Queue
  description: |
    Celery is a simple, flexible, and reliable distributed system to process vast amounts of messages,
    while providing operations with the tools required to maintain such a system.
  dev_url: https://github.com/celery/celery
  doc_url: https://docs.celeryq.dev

extra:
  recipe-maintainers:
    - kwilcox
    - pmlandwehr
    - sodre
    - edetec
